name: Verify credential files are not tracked
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed local credentials
        run: |
          test ! -f book-inventory-api/.env
          test -f book-inventory-api/.env.example
          git ls-files | grep -qv '^book-inventory-api/\.env$'
